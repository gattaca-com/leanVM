[package]
name = "leanvm-cli"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "leanvm"
path = "src/main.rs"
# Its rustdoc would overwrite the `leanvm` library's (cargo#6313).
doc = false

[lints]
workspace = true

[dependencies]
flux-profiler = { git = "https://github.com/gattaca-com/flux", rev = "cb55dcb7fd31d525b09317f98ed0e47fac4ea60a", features = ["perf", "alloc-profile"] }
tracing-subscriber.workspace = true
rec_aggregation = { workspace = true, features = ["signers-cache"] }
leanvm_core.workspace = true
lean_compiler.workspace = true
lean_da.workspace = true
keccak_gkr = { workspace = true, features = ["bench"] }
signatures.workspace = true
primitives.workspace = true
bench.workspace = true
rand.workspace = true
bincode.workspace = true
serde.workspace = true
tracing.workspace = true
clap = { version = "4", features = ["derive"] }
