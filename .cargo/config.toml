[alias]
testall = ["test", "--release", "--workspace"]
clippyall = ["clippy", "--release", "--workspace", "--all-targets", "--", "-D", "warnings"]
docall = ["doc", "--release", "--workspace", "--no-deps"]
leanvm = ["run", "--release", "-p", "leanvm-cli", "--"]

[build]
rustdocflags = ["-D", "warnings"]

[target.'cfg(all())']
rustflags = ["-C", "target-cpu=native"]

[net]
# flux-profiler is a git dependency on a private repo: fetch it with the git CLI and its credentials.
git-fetch-with-cli = true
